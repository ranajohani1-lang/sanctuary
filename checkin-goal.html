<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Sanctuary - Goals</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
tailwind.config={darkMode:"class",theme:{extend:{colors:{"secondary-container":"#d8f9e0","outline":"#757c7b","on-primary":"#f9f8ff","tertiary":"#685881","surface-container-low":"#f1f4f3","secondary-fixed-dim":"#caead2","tertiary-container":"#dbc6f6","secondary":"#496552","secondary-fixed":"#d8f9e0","on-secondary-fixed":"#324e3c","on-tertiary-container":"#4e3e66","on-secondary-container":"#44604d","surface":"#f8faf9","outline-variant":"#adb3b2","on-surface-variant":"#5a6060","surface-container-highest":"#dde4e3","primary":"#445e97","primary-dim":"#38528a","primary-container":"#a7c0ff","surface-container-high":"#e4e9e8","surface-container-lowest":"#ffffff","on-primary-container":"#1f3a71","on-surface":"#2d3433"},borderRadius:{DEFAULT:"1rem",lg:"2rem",xl:"3rem",full:"9999px"},fontFamily:{headline:["Plus Jakarta Sans"],body:["Be Vietnam Pro"]}}}}
</script>
<style>
body{font-family:'Be Vietnam Pro',sans-serif;min-height:max(884px,100dvh);}
.font-plus-jakarta,h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
.ghost-border{box-shadow:inset 0 0 0 1px rgba(173,179,178,0.15);}
</style></head>
<body class="bg-surface text-on-surface min-h-screen">
<header class="fixed top-0 w-full z-50 bg-slate-50/80 backdrop-blur-xl shadow-sm h-16 px-6 flex justify-between items-center">
<div class="flex items-center gap-3"><span class="material-symbols-outlined text-indigo-600">spa</span><h1 class="font-plus-jakarta text-xl font-bold tracking-tight text-indigo-900">The Sanctuary</h1></div>
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container text-xs font-bold">JS</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-2xl mx-auto">
<div class="mb-12">
<div class="flex justify-between items-end mb-4">
<span class="font-plus-jakarta font-bold text-primary-dim text-sm tracking-widest uppercase">Almost there</span>
<span class="font-plus-jakarta font-extrabold text-3xl text-on-surface">Step 6 <span class="text-outline-variant font-light">/ 7</span></span>
</div>
<div class="h-3 w-full bg-surface-container-highest rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-secondary to-secondary-fixed-dim rounded-full transition-all duration-1000" style="width:85%;"></div></div>
</div>
<section class="mb-16">
<div class="mb-8">
<h2 class="font-plus-jakarta text-2xl font-bold text-on-surface leading-tight mb-2">What is one small thing you want to try next week?</h2>
<p class="text-on-surface-variant">Choose a tiny habit that feels manageable for you right now.</p>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="relative group p-6 rounded-xl bg-surface-container-lowest ghost-border text-left transition-all hover:bg-indigo-50/50">
<div class="mb-4 w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container"><span class="material-symbols-outlined">bedtime</span></div>
<span class="font-plus-jakarta font-bold text-on-surface block mb-1">More sleep</span>
<span class="text-xs text-on-surface-variant block leading-relaxed">Better rest for a clearer mind</span>
<div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity"><div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-white text-[16px]" style="font-variation-settings:'FILL' 1;">check</span></div></div>
</button>
<button class="relative group p-6 rounded-xl bg-surface-container-lowest ghost-border text-left transition-all hover:bg-indigo-50/50">
<div class="mb-4 w-12 h-12 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container"><span class="material-symbols-outlined">phonelink_off</span></div>
<span class="font-plus-jakarta font-bold text-on-surface block mb-1">Less screen time</span>
<span class="text-xs text-on-surface-variant block leading-relaxed">Disconnect to reconnect</span>
</button>
<button class="relative group p-6 rounded-xl bg-surface-container-lowest ghost-border text-left transition-all hover:bg-indigo-50/50">
<div class="mb-4 w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container"><span class="material-symbols-outlined">directions_walk</span></div>
<span class="font-plus-jakarta font-bold text-on-surface block mb-1">Daily walk</span>
<span class="text-xs text-on-surface-variant block leading-relaxed">10 minutes of fresh air</span>
</button>
<button class="relative group p-6 rounded-xl bg-surface-container-lowest ghost-border text-left transition-all hover:bg-indigo-50/50">
<div class="mb-4 w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed"><span class="material-symbols-outlined">water_drop</span></div>
<span class="font-plus-jakarta font-bold text-on-surface block mb-1">Drink water</span>
<span class="text-xs text-on-surface-variant block leading-relaxed">Stay hydrated all day</span>
</button>
</div></section>
<section class="mb-20">
<div class="mb-10 text-center">
<h2 class="font-plus-jakarta text-2xl font-bold text-on-surface leading-tight mb-2">How confident do you feel?</h2>
<p class="text-on-surface-variant">On a scale of 1 to 5, how ready are you to try this?</p>
</div>
<div class="flex justify-between items-center gap-2">
<button class="flex-1 aspect-square rounded-xl bg-surface-container-low flex flex-col items-center justify-center gap-2 hover:bg-tertiary-container/30 transition-colors"><span class="font-plus-jakarta font-bold text-xl">1</span><span class="text-[10px] uppercase tracking-wider font-bold text-outline">Unsure</span></button>
<button class="flex-1 aspect-square rounded-xl bg-surface-container-low flex flex-col items-center justify-center gap-2 hover:bg-tertiary-container/30 transition-colors"><span class="font-plus-jakarta font-bold text-xl">2</span><span class="text-[10px] uppercase tracking-wider font-bold text-outline">Maybe</span></button>
<button class="flex-1 aspect-square rounded-xl bg-surface-container-lowest ghost-border flex flex-col items-center justify-center gap-2 shadow-[0_10px_30px_rgba(104,88,129,0.1)] scale-110 ring-2 ring-tertiary"><span class="font-plus-jakarta font-bold text-xl text-tertiary">3</span><span class="text-[10px] uppercase tracking-wider font-bold text-tertiary">Getting ready</span></button>
<button class="flex-1 aspect-square rounded-xl bg-surface-container-low flex flex-col items-center justify-center gap-2 hover:bg-tertiary-container/30 transition-colors"><span class="font-plus-jakarta font-bold text-xl">4</span><span class="text-[10px] uppercase tracking-wider font-bold text-outline">Ready</span></button>
<button class="flex-1 aspect-square rounded-xl bg-surface-container-low flex flex-col items-center justify-center gap-2 hover:bg-tertiary-container/30 transition-colors"><span class="font-plus-jakarta font-bold text-xl">5</span><span class="text-[10px] uppercase tracking-wider font-bold text-outline">Strong</span></button>
</div></section>
<div class="flex flex-col gap-4">
<a href="checkin-review.html" class="w-full h-16 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-plus-jakarta font-extrabold text-lg flex items-center justify-center gap-3 shadow-xl shadow-primary/20 active:scale-95 transition-transform">Review &amp; Submit<span class="material-symbols-outlined">arrow_forward</span></a>
<a href="checkin-support.html" class="text-center text-sm text-outline-variant font-medium hover:text-primary">← Back</a>
</div></main>
<div class="fixed -bottom-10 -right-10 w-64 h-64 bg-tertiary-container/20 rounded-full blur-3xl -z-10"></div>
<div class="fixed top-20 -left-10 w-48 h-48 bg-secondary-container/30 rounded-full blur-3xl -z-10"></div>
<script src="nav.js"></script>
</body></html>
